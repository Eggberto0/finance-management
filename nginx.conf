server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
```

O `try_files` é importante — sem ele, ao acessar `/accounts` diretamente o Nginx retornaria 404, porque é o React que gerencia as rotas, não o servidor.

Cria também o `.dockerignore` na raiz:
```
node_modules
dist
.env
.git